name: Build Wildmere

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL directa a un ZIP (opcional)"
        required: false
        default: ""

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    name: Android - ${{ matrix.label }}
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: game
            label: Wildmere
            artifact: Wildmere-Android-APK
          - dir: archive/tiny_companions_v0.2.1
            label: Prototipo 0.2.1
            artifact: Prototipo-0.2.1-Android-APK
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
        run: |
          set -e
          rm -rf proj && mkdir proj
          if [ -n "$ZIP_URL" ]; then
            wget -q -O project.zip "$ZIP_URL"
            ZIP=project.zip
          else
            ZIP="$(ls -1 wildmere*.zip 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          [ -n "$ZIP" ] || { echo "ERROR: no hay ningun wildmere*.zip en la raiz"; exit 1; }
          echo "Usando ZIP: $ZIP"
          unzip -q -o "$ZIP" -d proj
          ROOT="$(dirname "$(dirname "$(find proj -maxdepth 4 -path '*/game/project.godot' | head -n1)")")"
          PROJ="$ROOT/${{ matrix.dir }}"
          [ -f "$PROJ/project.godot" ] || { echo "ERROR: no existe $PROJ/project.godot"; exit 1; }
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          ls "$PROJ"

      - name: Preparar Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true

      - name: Prueba automatica (no bloquea la compilacion)
        continue-on-error: true
        run: |
          cd "$PROJ"
          chmod -R a+rwX .
          mkdir -p .godot/editor
          godot --headless --import > "$GITHUB_WORKSPACE/import.log" 2>&1 || true
          godot --headless --path . --quit-after 1200 -- --autotest > "$GITHUB_WORKSPACE/test.log" 2>&1 || true
          {
            echo "## Prueba automatica - ${{ matrix.label }}"
            echo '```'
            grep -E "^  (ok|FAIL)|AUTOTEST|SCRIPT ERROR|Parse Error|ERROR:" "$GITHUB_WORKSPACE/test.log" | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -v "is not exposed, skipping" "$GITHUB_WORKSPACE/test.log" | tail -60
          grep -q "AUTOTEST OK" "$GITHUB_WORKSPACE/test.log"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-log-${{ matrix.artifact }}
          path: |
            test.log
            import.log

      - name: Preparar Android
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $HOME/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          SDK=""
          for d in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" /usr/lib/android-sdk /usr/local/lib/android/sdk /opt/android-sdk /root/android-sdk /root/android; do
            if [ -n "$d" ] && [ -d "$d/build-tools" ]; then SDK="$d"; break; fi
          done
          JDK="${JAVA_HOME:-}"
          if [ -z "$JDK" ]; then JDK="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"; fi
          echo "SDK=$SDK"
          echo "JDK=$JDK"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$SDK\""
            echo "export/android/java_sdk_path = \"$JDK\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > ~/.config/godot/editor_settings-4.3.tres

      - name: Exportar APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cd "$PROJ"
          mkdir -p build/android
          godot --headless --verbose --export-debug "Android" build/android/app.apk
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/android/app.apk "$GITHUB_WORKSPACE/out/${{ matrix.artifact }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/${{ matrix.artifact }}.apk

  windows:
    name: Windows - Wildmere
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
        run: |
          set -e
          rm -rf proj && mkdir proj
          if [ -n "$ZIP_URL" ]; then
            wget -q -O project.zip "$ZIP_URL"
            ZIP=project.zip
          else
            ZIP="$(ls -1 wildmere*.zip 2>/dev/null | sort -V | tail -n1 || true)"
          fi
          [ -n "$ZIP" ] || { echo "ERROR: no hay ningun wildmere*.zip en la raiz"; exit 1; }
          unzip -q -o "$ZIP" -d proj
          ROOT="$(dirname "$(dirname "$(find proj -maxdepth 4 -path '*/game/project.godot' | head -n1)")")"
          echo "PROJ=$ROOT/game" >> "$GITHUB_ENV"

      - name: Preparar plantillas
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true

      - name: Exportar
        run: |
          cd "$PROJ"
          chmod -R a+rwX .
          mkdir -p .godot/editor build/windows
          godot --headless --import || true
          godot --headless --verbose --export-release "Windows Desktop" build/windows/Wildmere.exe
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -r build/windows/. "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: Wildmere-Windows
          path: out
