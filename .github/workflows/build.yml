name: Build Tiny Companions

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL directa a un ZIP (opcional; si se deja vacío se usa el .zip del repositorio)"
        required: false
        default: ""

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
        run: |
          set -e
          rm -rf proj && mkdir proj
          if [ -n "$ZIP_URL" ]; then
            wget -q -O project.zip "$ZIP_URL"
            ZIP=project.zip
          else
            ZIP="$(ls -1 *.zip 2>/dev/null | head -n1 || true)"
          fi
          [ -n "$ZIP" ] || { echo "ERROR: no hay ningun .zip en la raiz del repositorio"; exit 1; }
          echo "Usando ZIP: $ZIP"
          unzip -q -o "$ZIP" -d proj
          P="$(dirname "$(find proj -name project.godot | head -n1)")"
          [ -f "$P/project.godot" ] || { echo "ERROR: el ZIP no contiene project.godot"; exit 1; }
          echo "PROJ=$P" >> "$GITHUB_ENV"
          echo "Proyecto en: $P"
          ls -la "$P"
          ls "$P/scenes" "$P/export_presets.cfg"

      - name: Preparar Android
        run: |
          mkdir -p ~/.local/share/godot/export_templates ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore $HOME/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          SDK=""
          for d in "$ANDROID_SDK_ROOT" "$ANDROID_HOME" /usr/lib/android-sdk /usr/local/lib/android/sdk /opt/android-sdk /root/android-sdk /root/android; do
            if [ -n "$d" ] && [ -d "$d/build-tools" ]; then SDK="$d"; break; fi
          done
          JDK="${JAVA_HOME:-}"
          if [ -z "$JDK" ]; then JDK="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"; fi
          echo "SDK=$SDK"
          echo "JDK=$JDK"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$SDK\""
            echo "export/android/java_sdk_path = \"$JDK\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > ~/.config/godot/editor_settings-4.3.tres
          cat ~/.config/godot/editor_settings-4.3.tres

      - name: Exportar APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /github/home/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          cd "$PROJ"
          chmod -R a+rwX .
          mkdir -p .godot/editor build/android
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" build/android/TinyCompanions.apk
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/android/TinyCompanions.apk "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: TinyCompanions-Android-APK
          path: out/TinyCompanions.apk

  windows:
    name: Windows
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir proyecto
        env:
          ZIP_URL: ${{ github.event.inputs.zip_url }}
        run: |
          set -e
          rm -rf proj && mkdir proj
          if [ -n "$ZIP_URL" ]; then
            wget -q -O project.zip "$ZIP_URL"
            ZIP=project.zip
          else
            ZIP="$(ls -1 *.zip 2>/dev/null | head -n1 || true)"
          fi
          [ -n "$ZIP" ] || { echo "ERROR: no hay ningun .zip en la raiz del repositorio"; exit 1; }
          unzip -q -o "$ZIP" -d proj
          P="$(dirname "$(find proj -name project.godot | head -n1)")"
          [ -f "$P/project.godot" ] || { echo "ERROR: el ZIP no contiene project.godot"; exit 1; }
          echo "PROJ=$P" >> "$GITHUB_ENV"

      - name: Preparar plantillas
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true

      - name: Exportar
        run: |
          cd "$PROJ"
          chmod -R a+rwX .
          mkdir -p .godot/editor build/windows
          godot --headless --import || true
          godot --headless --verbose --export-release "Windows Desktop" build/windows/TinyCompanions.exe
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp -r build/windows/. "$GITHUB_WORKSPACE/out/"

      - uses: actions/upload-artifact@v4
        with:
          name: TinyCompanions-Windows
          path: out
