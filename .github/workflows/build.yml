name: Build Tiny Companions

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"

jobs:
  android:
    name: APK Android
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Preparar plantillas y Android
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/ ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore ~/debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/lib/android-sdk}}"
          JDK="$(dirname "$(dirname "$(readlink -f "$(which javac)")")")"
          echo "SDK=$SDK JDK=$JDK"
          cat > ~/.config/godot/editor_settings-4.3.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$SDK"
          export/android/java_sdk_path = "$JDK"
          export/android/debug_keystore = "$HOME/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
      - name: Exportar APK
        run: |
          mkdir -v -p build/android
          godot --headless --import || true
          godot --headless --verbose --export-debug "Android" build/android/TinyCompanions.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TinyCompanions-Android-APK
          path: build/android/TinyCompanions.apk

  windows:
    name: Windows
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Preparar plantillas
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Exportar
        run: |
          mkdir -v -p build/windows
          godot --headless --import || true
          godot --headless --verbose --export-release "Windows Desktop" build/windows/TinyCompanions.exe
      - uses: actions/upload-artifact@v4
        with:
          name: TinyCompanions-Windows
          path: build/windows
